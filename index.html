<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>輔大青韻獎 49屆</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --sky:#dfeaf6;
    --sky-2:#eaf3fb;
    --ink:#2f5f7a;
    --ink-soft:#5b86a0;
    --card:#ffffff;
    --accent:#f7d774;
    --accent-deep:#eec24b;
    --line:#c9def0;
    --shadow:rgba(47,95,122,.14);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    font-family:"Noto Sans TC",system-ui,sans-serif;
    color:var(--ink);
    background:linear-gradient(180deg,var(--sky-2) 0%,var(--sky) 100%);
    min-height:100vh;
    display:flex;
    justify-content:center;
    padding:44px 20px 60px;
  }

  /* faint staff lines in the background — the music touch */
  body::before{
    content:"";
    position:fixed;
    inset:0;
    background-image:repeating-linear-gradient(
      to bottom,
      transparent 0,
      transparent 46px,
      rgba(91,134,160,.06) 46px,
      rgba(91,134,160,.06) 47px
    );
    pointer-events:none;
    z-index:0;
  }

  .wrap{
    width:100%;
    max-width:440px;
    position:relative;
    z-index:1;
    display:flex;
    flex-direction:column;
    align-items:center;
  }

  /* logo placeholder */
  .logo{
    width:150px;height:150px;
    border-radius:50%;
    background:
      radial-gradient(circle at 50% 40%, #ffffff 0%, #eef6fd 70%);
    border:2px dashed var(--line);
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    color:var(--ink-soft);
    font-size:13px;
    letter-spacing:.5px;
    box-shadow:0 10px 30px var(--shadow);
    position:relative;
  }
  .logo::after{
    content:"♪";
    position:absolute;
    top:-10px;right:-6px;
    width:38px;height:38px;
    background:var(--accent);
    color:#fff;
    border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-size:20px;
    box-shadow:0 6px 14px rgba(238,194,75,.5);
    animation:bob 3s ease-in-out infinite;
  }
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
  .logo span{max-width:100px;line-height:1.5}

  /* title */
  .title{
    margin-top:22px;
    text-align:center;
  }
  .eyebrow{
    font-family:"Poppins",sans-serif;
    font-size:12px;
    letter-spacing:4px;
    color:var(--ink-soft);
    text-transform:uppercase;
    display:block;
    margin-bottom:6px;
  }
  .handle{
    font-family:"Poppins",sans-serif;
    font-weight:700;
    font-size:30px;
    color:var(--ink);
    letter-spacing:.5px;
  }
  .sub{
    margin-top:8px;
    font-size:15px;
    color:var(--ink-soft);
    font-weight:500;
  }

  /* instagram */
  .ig{
    margin-top:18px;
    width:46px;height:46px;
    border-radius:14px;
    background:var(--card);
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 6px 18px var(--shadow);
    transition:transform .2s ease, box-shadow .2s ease;
  }
  .ig:hover{transform:translateY(-3px);box-shadow:0 10px 24px var(--shadow)}
  .ig svg{width:24px;height:24px;stroke:var(--ink);fill:none}

  /* links */
  .links{
    margin-top:36px;
    width:100%;
    display:flex;
    flex-direction:column;
    gap:16px;
  }

  .link{
    display:flex;
    align-items:center;
    gap:16px;
    background:var(--card);
    border-radius:20px;
    padding:20px 22px;
    text-decoration:none;
    color:var(--ink);
    box-shadow:0 6px 20px var(--shadow);
    border:1px solid rgba(255,255,255,.6);
    position:relative;
    overflow:hidden;
    transition:transform .18s ease, box-shadow .18s ease;
  }
  /* left accent strip */
  .link::before{
    content:"";
    position:absolute;
    left:0;top:0;bottom:0;
    width:6px;
    background:linear-gradient(180deg,var(--accent) 0%,var(--accent-deep) 100%);
  }
  .link:hover{
    transform:translateY(-4px);
    box-shadow:0 14px 30px var(--shadow);
  }
  .link:active{transform:translateY(-1px)}

  .link .icon{
    flex-shrink:0;
    width:44px;height:44px;
    border-radius:12px;
    background:linear-gradient(135deg,#fdeec0,#f7d774);
    display:flex;align-items:center;justify-content:center;
    font-size:22px;
  }
  .link .text{flex:1}
  .link .text .name{
    font-weight:700;
    font-size:16.5px;
    line-height:1.4;
  }
  .link .text .desc{
    font-size:12.5px;
    color:var(--ink-soft);
    margin-top:3px;
    font-weight:500;
  }
  .link .arrow{
    flex-shrink:0;
    color:var(--ink-soft);
    font-size:18px;
    transition:transform .2s ease;
  }
  .link:hover .arrow{transform:translateX(4px)}

  /* footer */
  .foot{
    margin-top:44px;
    font-size:12px;
    color:var(--ink-soft);
    letter-spacing:1px;
    text-align:center;
    opacity:.8;
  }

  @media (max-width:380px){
    .handle{font-size:26px}
    .logo{width:130px;height:130px}
  }
</style>
</head>
<body>
  <div class="wrap">

    <div class="logo">
      <span>Logo<br>放置處</span>
    </div>

    <div class="title">
      <span class="eyebrow">FU JEN · 49TH</span>
      <div class="handle">fjuchinyun_49</div>
      <div class="sub">輔大青韻獎 第 49 屆</div>
    </div>

    <a class="ig" href="https://www.instagram.com/fjuchinyun_49/" target="_blank" rel="noopener" aria-label="Instagram">
      <svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="3" width="18" height="18" rx="5"/>
        <circle cx="12" cy="12" r="4"/>
        <circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/>
      </svg>
    </a>

    <div class="links">

      <a class="link" href="https://docs.google.com/forms/d/e/1FAIpQLSdrP1IR5cICU_wI-M6yIjxuKnBARARk191aHvuCqYys1Gt_ZA/viewform?usp=publish-editor" target="_blank" rel="noopener">
        <div class="icon">🎪</div>
        <div class="text">
          <div class="name">49屆青韻市集招募</div>
          <div class="desc">攤位報名，一起加入市集</div>
        </div>
        <div class="arrow">→</div>
      </a>

    </div>

    <div class="foot">FU JEN CHIN YUN AWARD · 49</div>

  </div>
</body>
</html>
