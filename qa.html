<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- 改屆數在這裡！（瀏覽器分頁上的標題） -->
<title>輔大青韻獎 49屆｜常見問題</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --sky:#dfeaf6;
    --sky-2:#eaf3fb;
    --ink:#2f5f7a;
    --ink-soft:#5b86a0;
    --card:#ffffff;
    --accent:#f7d774;
    --accent-deep:#eec24b;
    --line:#c9def0;
    --shadow:rgba(47,95,122,.14);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    font-family:"Noto Sans TC",system-ui,sans-serif;
    color:var(--ink);
    background:linear-gradient(180deg,var(--sky-2) 0%,var(--sky) 100%);
    min-height:100vh;
    display:flex;
    justify-content:center;
    padding:24px 20px 60px;
  }
  body::before{
    content:"";
    position:fixed;
    inset:0;
    background-image:repeating-linear-gradient(
      to bottom,
      transparent 0,
      transparent 46px,
      rgba(91,134,160,.06) 46px,
      rgba(91,134,160,.06) 47px
    );
    pointer-events:none;
    z-index:0;
  }

  .wrap{
    width:100%;
    max-width:520px;
    position:relative;
    z-index:1;
  }

  /* 返回按鈕 */
  .back{
    display:inline-flex;
    align-items:center;
    gap:8px;
    margin-bottom:20px;
    padding:10px 18px;
    background:var(--card);
    border-radius:999px;
    text-decoration:none;
    color:var(--ink);
    font-size:14px;
    font-weight:500;
    box-shadow:0 4px 14px var(--shadow);
    border:1px solid rgba(255,255,255,.6);
    transition:transform .18s ease, box-shadow .18s ease;
  }
  .back:hover{transform:translateX(-3px);box-shadow:0 8px 20px var(--shadow)}
  .back .ar{font-size:17px;line-height:1}

  /* 標題 */
  .head{
    text-align:center;
    margin-bottom:28px;
  }
  .head .eyebrow{
    font-family:"Poppins",sans-serif;
    font-size:12px;
    letter-spacing:4px;
    color:var(--ink-soft);
    text-transform:uppercase;
    display:block;
    margin-bottom:8px;
  }
  .head h1{
    font-size:26px;
    font-weight:900;
    color:var(--ink);
    display:inline-flex;
    align-items:center;
    gap:8px;
  }
  .head .note{
    margin-top:24px;
  }
  .head .music{font-size:22px}

  /* Q&A 折疊清單 */
  .faq{
    display:flex;
    flex-direction:column;
    gap:14px;
  }
  .item{
    background:var(--card);
    border-radius:18px;
    box-shadow:0 6px 18px var(--shadow);
    border:1px solid rgba(255,255,255,.6);
    overflow:hidden;
    position:relative;
  }
  .item::before{
    content:"";
    position:absolute;
    left:0;top:0;bottom:0;
    width:5px;
    background:linear-gradient(180deg,var(--accent) 0%,var(--accent-deep) 100%);
  }
  .q{
    width:100%;
    text-align:left;
    background:none;
    border:none;
    cursor:pointer;
    padding:20px 22px 20px 26px;
    display:flex;
    align-items:center;
    gap:14px;
    font-family:inherit;
    font-size:16px;
    font-weight:700;
    color:var(--ink);
    line-height:1.5;
  }
  .q .qmark{
    flex-shrink:0;
    width:30px;height:30px;
    border-radius:50%;
    background:linear-gradient(135deg,#fdeec0,#f7d774);
    display:flex;align-items:center;justify-content:center;
    font-family:"Poppins",sans-serif;
    font-weight:700;
    font-size:15px;
    color:var(--ink);
  }
  .q .qtext{flex:1}
  .q .plus{
    flex-shrink:0;
    font-size:22px;
    color:var(--ink-soft);
    transition:transform .25s ease;
    line-height:1;
  }
  .item.open .plus{transform:rotate(45deg)}

  .a{
    max-height:0;
    overflow:hidden;
    transition:max-height .3s ease;
  }
  .a-inner{
    padding:0 22px 20px 26px;
    font-size:14.5px;
    line-height:1.75;
    color:#4a4a4a;
    font-weight:400;
  }

  .foot{
    margin-top:36px;
    font-size:12px;
    color:var(--ink-soft);
    letter-spacing:1px;
    text-align:center;
    opacity:.8;
  }

  @media (max-width:380px){
    .head h1{font-size:22px}
    .q{font-size:15px}
  }
</style>
</head>
<body>
  <div class="wrap">

    <!-- 返回按鈕：連回主頁 index.html，通常不用改 -->
    <a class="back" href="index.html">
      <span class="ar">←</span> 返回首頁
    </a>

    <div class="head">
      <!-- 改屆數在這裡！ -->
      <span class="eyebrow">FU JEN · 49TH</span>
      <h1><span class="music">🎵</span> 常見問題 Q&amp;A</h1>
    </div>

    <div class="faq">

      <!-- ============================================================
           新增問答在這裡！
           要多加一題，就複製下面整段 <div class="item">...</div> 貼上，
           再改兩個地方：
             1. <span class="qtext">  → 換成問題
             2. <div class="a-inner"> → 換成答案
           （前面的 Q 圓圈、+ 號都不用動）
           ============================================================ -->

      <div class="item">
        <button class="q">
          <span class="qmark">Q</span>
          <span class="qtext">報名資格是什麼？誰可以參加？</span>
          <span class="plus">+</span>
        </button>
        <div class="a">
          <div class="a-inner">（範例答案，請改成實際內容）凡本校在學學生皆可報名參加，詳細資格請參閱簡章說明。</div>
        </div>
      </div>

      <div class="item">
        <button class="q">
          <span class="qmark">Q</span>
          <span class="qtext">可以幾個人一組報名？</span>
          <span class="plus">+</span>
        </button>
        <div class="a">
          <div class="a-inner">（範例答案，請改成實際內容）個人組與團體組皆可報名，團體人數上限請以簡章公告為準。</div>
        </div>
      </div>

      <div class="item">
        <button class="q">
          <span class="qmark">Q</span>
          <span class="qtext">報名要準備哪些資料？</span>
          <span class="plus">+</span>
        </button>
        <div class="a">
          <div class="a-inner">（範例答案，請改成實際內容）需填寫線上報名表並上傳指定資料，細節請見報名表單說明。</div>
        </div>
      </div>

      <div class="item">
        <button class="q">
          <span class="qmark">Q</span>
          <span class="qtext">報名截止後還能補件嗎？</span>
          <span class="plus">+</span>
        </button>
        <div class="a">
          <div class="a-inner">（範例答案，請改成實際內容）如有相關規定將另行公告，建議於截止前完成所有報名程序。</div>
        </div>
      </div>

      <!-- 新增問答就複製上面一整段 <div class="item">...</div> 貼在這行前面 -->

    </div>

    <!-- 改屆數在這裡！ -->
    <div class="foot">FU JEN CHIN YUN AWARD · 49</div>

  </div>

<script>
  // 點問題展開／收合答案
  document.querySelectorAll('.q').forEach(function(btn){
    btn.addEventListener('click', function(){
      var item = btn.parentElement;
      var ans = item.querySelector('.a');
      var isOpen = item.classList.contains('open');
      if(isOpen){
        item.classList.remove('open');
        ans.style.maxHeight = null;
      } else {
        item.classList.add('open');
        ans.style.maxHeight = ans.scrollHeight + 'px';
      }
    });
  });
</script>
</body>
</html>
